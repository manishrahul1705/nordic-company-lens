name: Signalpost macOS verification

on:
  workflow_dispatch:
  push:
    branches:
      - xplat-check

permissions:
  contents: read

jobs:
  verify:
    name: macOS / Python ${{ matrix.python }}
    runs-on: macos-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check CLI
        run: uv run --frozen signalpost --help

      - name: Run tests
        run: uv run --frozen python -m pytest -q
