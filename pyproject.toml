[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "nordic-company-lens"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.12,<3", "tldextract>=5.3,<6", "dnspython>=2.7,<3"]

[project.scripts]
signalpost = "signalpost.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "respx>=0.22,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/signalpost"]

[tool.hatch.build.targets.wheel.force-include]
"data/shared_identifiers.json.gz" = "signalpost/data/shared_identifiers.json.gz"
"data/cc_orgnr_index.json.gz" = "signalpost/data/cc_orgnr_index.json.gz"
"data/SHARED_IDENTIFIERS_NOTICE.md" = "signalpost/data/SHARED_IDENTIFIERS_NOTICE.md"
"data/CC_INDEX_NOTICE.md" = "signalpost/data/CC_INDEX_NOTICE.md"
