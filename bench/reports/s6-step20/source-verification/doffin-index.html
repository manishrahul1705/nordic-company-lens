    <div id="root"></div>
    <!-- Inject Skyra Survey Script -->
    <script>
      window.SKYRA_CONFIG = {
        org: 'dfo',
        // Skyra derives its cookie domain from the hostname's last two
        // labels, which collapses to the public suffix "azurewebsites.net"
        // on *.azurewebsites.net hosts. Browsers reject cookies scoped to
        // a public suffix, so Skyra can never persist completion/retake
        // state there unless we override it with the exact host.
        cookieDomain: window.location.hostname
      };
      const script = document.createElement('script');
      script.src = 'https://survey.skyra.no/skyra-survey.js';
      document.body.appendChild(script);
    </script>
